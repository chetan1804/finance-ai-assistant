name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance-test-password
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://finance:finance-test-password@127.0.0.1:5432/finance_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update
      - run: sudo apt-get install --yes postgresql-client
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pytest -q
      - name: Enforce offline AI reliability gate
        run: python -m scripts.evaluate_finance_agent --min-score 1.0
      - run: node --check src/ui/static/app.js

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: false
          load: true
          tags: finance-assistant:ci
          build-args: |
            FINANCE_RELEASE_VERSION=ci
            FINANCE_COMMIT_SHA=${{ github.sha }}
            FINANCE_BUILD_DATE=ci
      - name: Start release image
        run: >-
          docker run --detach --name finance-assistant-ci
          --publish 18000:8000 finance-assistant:ci
      - name: Smoke test release image
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              curl --fail --silent http://127.0.0.1:18000/version
              exit 0
            fi
            sleep 1
          done
          docker logs finance-assistant-ci
          exit 1
      - name: Enforce API performance budget
        run: >-
          python3 -m scripts.load_test_api
          --base-url http://127.0.0.1:18000
          --endpoint /ready
          --requests 200
          --concurrency 20
          --max-p95-ms 500
          --min-rps 20
          --max-error-rate 0
      - name: Stop release image
        if: always()
        run: docker rm --force finance-assistant-ci
