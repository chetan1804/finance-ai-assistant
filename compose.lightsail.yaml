name: arthnivo

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    networks:
      - backend

  arthnivo:
    build:
      context: .
      args:
        FINANCE_RELEASE_VERSION: ${FINANCE_RELEASE_VERSION:-development}
        FINANCE_COMMIT_SHA: ${FINANCE_COMMIT_SHA:-unknown}
        FINANCE_BUILD_DATE: ${FINANCE_BUILD_DATE:-unknown}
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is required}
      FINANCE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FINANCE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      FINANCE_ENVIRONMENT: production
      FINANCE_ALLOWED_HOSTS: ${FINANCE_ALLOWED_HOSTS:?FINANCE_ALLOWED_HOSTS is required}
      FINANCE_HTTPS_REDIRECT: ${FINANCE_HTTPS_REDIRECT:-false}
      FINANCE_HSTS_SECONDS: ${FINANCE_HSTS_SECONDS:-31536000}
      FINANCE_FORWARDED_ALLOW_IPS: "*"
      FINANCE_LOG_LEVEL: ${FINANCE_LOG_LEVEL:-INFO}
      FINANCE_LOG_FORMAT: json
      FINANCE_DB_POOL_MIN_SIZE: "1"
      FINANCE_DB_POOL_MAX_SIZE: "5"
      FINANCE_CHECKPOINT_POOL_MIN_SIZE: "1"
      FINANCE_CHECKPOINT_POOL_MAX_SIZE: "3"
      FINANCE_BACKUP_DIR: /app/backups
      PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - finance-backups:/app/backups
    networks:
      - backend
      - edge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ARTHNIVO_SITE_ADDRESS: ${ARTHNIVO_SITE_ADDRESS:?ARTHNIVO_SITE_ADDRESS is required}
    depends_on:
      arthnivo:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.lightsail:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
  redis-data:
  finance-backups:
  caddy-data:
  caddy-config:
